packages:
  - "packages/*"

# Shared dependency pins. Each package references these with `catalog:effect`,
# so the Effect toolchain moves in one place. The versions must agree:
# `@effect/vitest` 4.0.6 peers `effect ^4.0.6` and `vitest >=5 <6`, and
# `@effect/tsgo` 0.57.0 supports oxlint 1.87.0-1.89.0, so the root `oxlint`
# pin in package.json must stay inside that range.
catalogs:
  effect:
    effect: 4.0.6
    "@effect/tsgo": 0.57.0
    "@effect/vitest": 4.0.6
    oxlint-tsgolint: 7.0.2005
    vitest: 5.0.5

# Flue no longer needs a pin here. `@flue/runtime` 2.3.0 declares
# `@earendil-works/pi-ai` ^1.1.0, and 1.1.0 sends the `x-opencode-session`
# header that OpenCode Go requires. The 2.1.1-era override to 0.87.1 is gone.

# pnpm 11 no longer reads the package.json "pnpm" field; these projects are
# also installed standalone (tarball E2E envs, create-rwsdk output), so they
# carry their own build-script approvals.
#
# true  = run the package's install scripts.
# false = reviewed and deliberately not run. These three ship prebuilt; their
#         install scripts only print donation messages or run a prepare step
#         that is meant for source checkouts.
allowBuilds:
  "@google/genai": false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261026.1"
